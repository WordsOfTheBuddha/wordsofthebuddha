<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="none" stroke="#a06070" stroke-linecap="round" stroke-linejoin="round">
    <!-- the object receding, with motion streaks -->
    <circle cx="18.5" cy="6" r="3" stroke-width="0.8" opacity="0.55" />
    <path d="M 20.6 2.6 L 22.6 1.6 M 21.6 5.6 L 23.1 5.1" stroke-width="0.5" opacity="0.35" />
    <!-- consciousness orb, dragged after it -->
    <circle cx="7" cy="16.5" r="3.6" stroke-width="1" fill="#a06070" fill-opacity="0.16" />
    <circle cx="7" cy="16.5" r="1" fill="#a06070" stroke="none" opacity="0.5" />
    <!-- taut tether, hooked on the object -->
    <path d="M 9.9 14.6 L 15.6 8.3" stroke-width="1" />
    <path d="M 15.6 8.3 Q 17.5 6.6, 16.2 5.2" stroke-width="0.9" />
    <!-- drag streaks trailing behind the orb -->
    <path d="M 3.5 19.6 L 1.7 21.4 M 5.7 20.7 L 4.5 22.3" stroke-width="0.5" opacity="0.4" />
  </g>
</svg>
