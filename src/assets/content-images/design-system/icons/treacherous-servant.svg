<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g transform="translate(12, 12)">
    <!-- Bowing servant figure offering service forward while concealing a blade behind -->
    <g fill="none" stroke="#b08894" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="3.5" cy="-6.5" r="2.6" stroke-width="0.95" />
      <path d="M 2.5 -3.9 C 0.5 -1, -1 2.5, -1.5 6" stroke-width="1" />
      <!-- Front arm extended in polite service -->
      <path d="M 1.5 -2 L 7.5 -0.5 L 9.5 -2" stroke-width="0.9" />
      <!-- Legs -->
      <line x1="-1.5" y1="6" x2="-4" y2="10.5" stroke-width="0.9" />
      <line x1="-1.5" y1="6" x2="2" y2="10.5" stroke-width="0.9" />
      <!-- Back arm concealing blade -->
      <path d="M 1 -1.5 L -4.5 0.5" stroke-width="0.9" />
    </g>
    <!-- Concealed sharp blade behind back -->
    <path d="M -4.5 0.5 L -10.2 -3.8 L -7.8 2.2 Z" fill="#c06070" fill-opacity="0.35" stroke="#d06878" stroke-width="0.85" stroke-linejoin="round" />
  </g>
</svg>
