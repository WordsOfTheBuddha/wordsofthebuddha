title: "Gradual Training Guidelines"
description: "The step-by-step instructions given to a person in training: ethical conduct, sense restraint, moderation in eating, wakefulness, and radical comprehension, then seclusion, the abandoning of the hindrances, and the jhānas. Final knowledge is reached by this gradual training, practice, and progress."
