title: "Arising and Passing Away"
description: "The insight that discerns phenomena as they come into being and as they fade. In the discourses this is both a way of observing—dwelling seeing the arising and vanishing nature of body, felt experience, mind, and mental qualities—and a criterion of wisdom: one who knows and sees the arising and passing away of the aggregates is one for whom the taints wear away. This wisdom is noble, penetrative, and leads to the complete ending of suffering."
