title: Sleep
description: "Bodily rest, and a pleasure the mind can cling to. One who has abandoned the fevers of lust, aversion, and delusion sleeps at ease. Relishing sleep, or sleeping to excess, obstructs energy and the noble path. In training, one lies down mindfully for the middle watch of the night and rises without lingering in the pleasure of dozing."
